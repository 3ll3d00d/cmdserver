name: create apps
on:
  push:
    tags:
      - '*'
defaults:
  run:
    shell: bash
jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked
      - name: pytest
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv run pytest --cov=./cmdserver --cov-report=xml
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v5.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine release type
        id: release_type
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          make_latest: ${{ steps.release_type.outputs.prerelease == 'false' }}
  buildpypi:
    name: Publish to Pypi
    needs: create_release
    runs-on: ubuntu-latest
    # PyPI trusted publishing: the ezmote-cmdserver project on PyPI must list this repo, this workflow file and
    # the `release` environment as a trusted publisher.
    environment:
      name: release
      url: https://pypi.org/p/ezmote-cmdserver
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Get latest release version number
        id: get_version
        run: echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set version
        run: |
          echo ${{ steps.get_version.outputs.version-without-v }} > cmdserver/VERSION
      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Build dist
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          # Package version comes from the tag via hatch-vcs; pin it explicitly so a
          # shallow checkout can't produce a dev version.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.get_version.outputs.version-without-v }}
        run: uv build
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
  buildpyinstaller:
    name: Publish to Github
    needs: create_release
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Get latest release version number
        id: get_version
        run: echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set version
        run: |
          echo ${{ steps.get_version.outputs.version-without-v }} > cmdserver/VERSION
      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.get_version.outputs.version-without-v }}
        run: uv sync --locked --group exe
      - name: Create distribution
        id: create_dist
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          uv run pyinstaller --clean --log-level=INFO cmdserver.spec
          echo "binary_path=dist/cmdserver.exe" >> $GITHUB_OUTPUT
      - name: Upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} ${{ steps.create_dist.outputs.binary_path }}
