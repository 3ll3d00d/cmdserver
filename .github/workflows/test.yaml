name: run tests
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
    branches:
      - '**'
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
        experimental: [false]
        include:
          - python-version: '3.15.0-beta.4'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked
      - name: pytest
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv run pytest --cov=./cmdserver --cov-report=term
  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check build result
        # collapses the matrix into a single status that branch protection can require
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "build job did not succeed: ${{ needs.build.result }}"
            exit 1
          fi
