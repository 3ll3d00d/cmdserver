[project]
name = "ezmote-cmdserver"
dynamic = ["version"]
description = "A small webapp which can be used for web based home cinema automation"
authors = [
    { name = "3ll3d00d", email = "mattkhan+cmdserver@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13, <3.16"
dependencies = [
    "flask-restx >=1.3.0, <2.0.0",
    "Werkzeug >=3.1.6, <4.0",
    "flask >=3.1.0, <4.0",
    "pyyaml >=6.0.2, <7.0",
    "plumbum >=1.9.0, <3.0",
    "requests >=2.32.3, <3.0",
    "autobahn[twisted] >=24.4.2, <27.0",
    "paho-mqtt>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/3ll3d00d/cmdserver"
Repository = "https://github.com/3ll3d00d/cmdserver"

[project.scripts]
cmdserver = 'cmdserver.main:main'

[dependency-groups]
dev = [
    "pytest >=9.0.3, <9.3.0",
    "pytest-httpserver >=1.0.7, <1.3.0",
    "pytest-cov ~=7.1.0",
]
exe = [
    "pyinstaller ~=6.22.0; python_version >= '3.13' and python_version < '3.16'",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Version comes from the git tag (e.g. tag 2.1.0 -> 2.1.0); untagged commits get a dev version like
# 2.1.1.dev3+gabc1234. Builds without .git (docker) must set SETUPTOOLS_SCM_PRETEND_VERSION.
source = "vcs"

[tool.hatch.build]
# cmdserver/VERSION is generated at release/build time and is gitignored, so it must be force-included here or
# hatchling's default VCS-based exclusion will drop it from sdists and wheels.
artifacts = [
    "cmdserver/VERSION",
]

[tool.hatch.build.targets.wheel]
include = [
    "cmdserver/**",
]
